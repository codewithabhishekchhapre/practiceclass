<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
            background-color: #E9D6CD;
        }

        div{
            height: 550px;
            width: 300px;
            background-color:#e8e8e8;
            border-radius: 30px;
            padding: 15px;
            margin-top: 40px;
            margin-left: 150px ;
        }

        form input{
            border: none;
            padding: 5px;
            border-radius: 10px;
            width: 100%;
            height: 35px;
            /* background-color: orangered; */
        }

        .inpbutton{
            background-color: rgb(255, 55, 0);
            text-align: center;
            color: white;
            font-size: 18px;
        }

        .gray-text{
            color: gray;
        }

        .btn{
            background-color: rgb(224, 224, 224);
            color: rgb(0, 0, 0);
            font-size: 16px;
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 10px;
            border: none;

        }
        .btn img{
            height: 20px;
            width: 20px;
        }
        

    </style>

</head>
<body>
    
    <div>
        <h2>signup In</h2>
        <h5 class="gray-text">By Loging in, you agree to our Terms of Use</h5>

        <form action="">
            <label for="" class="gray-text">email</label> <br>
            <input type="email" placeholder="abc@gmail.com" name="" id=""> <br> <br>

            <p class="gray-text">we will send you an e-email with a login link</p>
            <input type="submit" class="inpbutton" value="Connect">
        </form>

        <br><br>


        <button class="btn"> <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRn_UTDYS8rVacqUiTjh8VLgCPU4w_svFP7axp4CHye8w&s=10"/> Sign in with google</button>
        <button class="btn"> <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQWV40JXxeCBHOXOX-69AMhZEBWixAbfC-QRi4QSzcIUw&s=10"/> Sign in with facebook</button>


    </div>

</body>
</html>
